   <g id="text_3">
    <text x="22.68" y="268.831445" transform="rotate(-0 22.68 268.831445)" font-size="12.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#8a9bab">示意图：三条路线的面积、工艺与设计自由度不同，不能只按效率排序。</text>
   </g>
   <g id="text_4">
    <text x="30.24" y="85.206187" transform="rotate(-0 30.24 85.206187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#ffffff">8 通道模分</text>
   </g>
   <g id="text_5">
    <text x="30.24" y="108.059219" transform="rotate(-0 30.24 108.059219)" font-weight="600" font-size="14px" font-family="MiSans, sans-serif" text-anchor="start" fill="#12263a">① 级联非对称耦合器</text>
   </g>
   <g id="text_6">
    <text x="45.36" y="129.558188" transform="rotate(-0 45.36 129.558188)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">逐级把基模搬到高阶</text>
   </g>
   <g id="text_7">
    <text x="45.36" y="155.766188" transform="rotate(-0 45.36 155.766188)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">每段长度由相位匹配定</text>
   </g>
   <g id="text_8">
    <text x="45.36" y="181.974187" transform="rotate(-0 45.36 181.974187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">宽带、版图规整</text>
   </g>
   <g id="text_9">
    <text x="45.36" y="208.182187" transform="rotate(-0 45.36 208.182187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">面积随通道数线性长</text>
   </g>
   <g id="text_10">
    <text x="192.528" y="85.218375" transform="rotate(-0 192.528 85.218375)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#ffffff">模式转换</text>
   </g>
   <g id="text_11">
    <text x="192.528" y="108.059219" transform="rotate(-0 192.528 108.059219)" font-weight="600" font-size="14px" font-family="MiSans, sans-serif" text-anchor="start" fill="#12263a">② 逆向设计</text>
   </g>
   <g id="text_12">
    <text x="207.648" y="129.558188" transform="rotate(-0 207.648 129.558188)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">只写目标，不写几何</text>
   </g>
   <g id="text_13">
    <text x="207.648" y="155.766188" transform="rotate(-0 207.648 155.766188)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">梯度告诉像素怎么改</text>
   </g>
   <g id="text_14">
    <text x="207.648" y="181.974187" transform="rotate(-0 207.648 181.974187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">面积最小、形状不规则</text>
   </g>
   <g id="text_15">
    <text x="207.648" y="208.182187" transform="rotate(-0 207.648 208.182187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">结果依赖初值与罚项</text>
   </g>
   <g id="text_16">
    <text x="354.816" y="85.206187" transform="rotate(-0 354.816 85.206187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#ffffff">改写模场形状</text>
   </g>
   <g id="text_17">
    <text x="354.816" y="108.129219" transform="rotate(-0 354.816 108.129219)" font-weight="600" font-size="14px" font-family="MiSans, sans-serif" text-anchor="start" fill="#12263a">③ 条–槽转换</text>
   </g>
   <g id="text_18">
    <text x="369.936" y="129.558188" transform="rotate(-0 369.936 129.558188)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">把场推进低折射率缝</text>
   </g>
   <g id="text_19">
    <text x="369.936" y="155.766188" transform="rotate(-0 369.936 155.766188)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">三种过渡结构可选</text>
   </g>
   <g id="text_20">
    <text x="369.936" y="181.974187" transform="rotate(-0 369.936 181.974187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">效率高、长度差异大</text>
   </g>
   <g id="text_21">
    <text x="369.936" y="208.182187" transform="rotate(-0 369.936 208.182187)" font-size="12px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">尖端受工艺限制</text>
   </g>
  </g>
 </g>
