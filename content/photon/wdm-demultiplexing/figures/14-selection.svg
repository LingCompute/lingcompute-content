<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.000 0.000 720.000 580.000" font-family="MiSans, sans-serif" font-weight="400" width="720.000pt" height="580.000pt">
 <rect width="720" height="580" fill="#ffffff" />
 <text x="32" y="28" font-size="16" fill="#4e9be8">选型路径</text>
 <text x="32" y="67" font-size="29" font-weight="600" fill="#12263a">先定通道数与间隔，再谈结构</text>
 <path d="M32 86 H96" stroke="#1f6fd0" stroke-width="4" />
 <g fill="#f1f7fe">
  <rect x="32" y="120" width="300" height="88" rx="12" />
  <rect x="32" y="226" width="300" height="88" rx="12" />
  <rect x="32" y="332" width="300" height="88" rx="12" />
  <rect x="32" y="438" width="300" height="88" rx="12" />
 </g>
 <g font-size="22" font-weight="500" fill="#0b4c9c">
  <text x="52" y="153">通道数 N</text>
  <text x="52" y="259">通道间隔</text>
  <text x="52" y="365">面积预算</text>
  <text x="52" y="471">温控能力</text>
 </g>
 <g font-size="19" fill="#4a6076">
  <text x="52" y="186">4 以内还是 8 以上</text>
  <text x="52" y="292">20 nm 还是 0.8 nm</text>
  <text x="52" y="398">片上还有多少地方</text>
  <text x="52" y="504">能不能锁温或加调谐</text>
 </g>
 <path d="M182 211 V222 M182 317 V328 M182 423 V434" stroke="#4e9be8" stroke-width="3" />
 <rect x="364" y="120" width="324" height="406" rx="14" fill="#fcebdb" />
 <text x="386" y="158" font-size="23" font-weight="500" fill="#e8823c">落到结构</text>
 <g font-size="18" fill="#4a6076">
  <text x="386" y="204">N ≤ 4 且间隔 20 nm：</text>
  <text x="386" y="233">MMI 或 EDG 就够</text>
  <text x="386" y="290">N ≥ 8 或间隔 0.8 nm：</text>
  <text x="386" y="319">AWG、级联微环</text>
  <text x="386" y="376">面积紧、可锁温：</text>
  <text x="386" y="405">微环阵列</text>
  <text x="386" y="462">无现成结构、指标奇特：</text>
  <text x="386" y="491">逆向设计</text>
 </g>
</svg>
