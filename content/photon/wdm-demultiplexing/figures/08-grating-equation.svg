   </g>
   <g id="text_5">
    <text x="370.44" y="55.167" transform="rotate(-0 370.44 55.167)" font-size="15px" font-family="MiSans, sans-serif" text-anchor="middle" fill="#e8823c">FSR ≈ λ² / (n_g·ΔL)</text>
   </g>
   <g id="text_6">
    <text x="370.44" y="76.97293" transform="rotate(-0 370.44 76.97293)" font-size="11.5px" font-family="MiSans, sans-serif" text-anchor="middle" fill="#4a6076">ΔL 越长，FSR 越窄</text>
   </g>
   <g id="text_7">
    <text transform="translate(27.72 124.326641)" font-size="12.5px" font-family="MiSans, sans-serif" fill="#4a6076">通道数 N 受 FSR 限制：N·Δλ_ch ≤ FSR，否则相邻衍射级次会重叠。这就是「</text>
    <text transform="translate(27.72 141.17625)" font-size="12.5px" font-family="MiSans, sans-serif" fill="#4a6076">通道越密，阵列越长、面积越大」的由来。</text>
   </g>
