   <g id="text_1">
    <text style="font-size: 13.5px; font-family: 'MiSans'; text-anchor: start; fill: #4e9be8" x="22.68" y="18.6975" transform="rotate(-0 22.68 18.6975)">结构总览 · 三条路线</text>
   </g>
   <g id="text_2">
    <text style="font-size: 25px; font-family: 'MiSans'; text-anchor: start; fill: #12263a" x="22.68" y="41.905" transform="rotate(-0 22.68 41.905)">三种把光分成两路的办法</text>
   </g>
   <g id="text_3">
    <text style="font-size: 16px; font-family: 'MiSans'; text-anchor: start; fill: #12263a" x="34.272" y="95.464" transform="rotate(-0 34.272 95.464)">Y 分支</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'MiSans'; text-anchor: start; fill: #e8823c" x="35.28" y="121.62" transform="rotate(-0 35.28 121.62)">分叉过渡</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #4a6076" transform="translate(34.272 227.718094)">一条波导逐渐张开，</text>
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #4a6076" transform="translate(34.272 244.291931)">对称就等分</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #0b4c9c" transform="translate(34.272 273.883938)">尺寸紧凑、天然等分</text>
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #0b4c9c" transform="translate(34.272 290.457775)">轮廓决定额外损耗</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'MiSans'; text-anchor: start; fill: #12263a" x="192.528" y="95.464" transform="rotate(-0 192.528 95.464)">定向耦合器</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'MiSans'; text-anchor: start; fill: #e8823c" x="193.536" y="121.62" transform="rotate(-0 193.536 121.62)">倏逝场耦合</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #4a6076" transform="translate(192.528 227.707031)">两条波导贴近，</text>
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #4a6076" transform="translate(192.528 244.280869)">功率来回换手</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #0b4c9c" transform="translate(192.528 273.883938)">比例连续可调</text>
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #0b4c9c" transform="translate(192.528 290.457775)">对波长与间距敏感</text>
   </g>
   <g id="text_11">
    <text style="font-size: 16px; font-family: 'MiSans'; text-anchor: start; fill: #12263a" x="350.784" y="95.464" transform="rotate(-0 350.784 95.464)">多模干涉（MMI）</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'MiSans'; text-anchor: start; fill: #e8823c" x="351.792" y="121.62" transform="rotate(-0 351.792 121.62)">多模相干</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #4a6076" transform="translate(350.784 227.011937)">宽区里多个模式</text>
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #4a6076" transform="translate(350.784 243.585775)">干涉成自成像</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #0b4c9c" transform="translate(350.784 273.883938)">结构最短、容差较宽</text>
    <text style="font-size: 11.8px; font-family: 'MiSans'; fill: #0b4c9c" transform="translate(350.784 290.457775)">长度需按波长设计</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'MiSans'; text-anchor: start; fill: #8a9bab" x="22.68" y="335.972656" transform="rotate(-0 22.68 335.972656)">缩略轮廓取自三个 Notebook 的真实几何；各图按自身视野缩放，未在同一比例下绘制</text>
   </g>
  </g>
