   </g>
   <g id="text_18">
    <text x="176.328" y="94.194806" transform="rotate(-0 176.328 94.194806)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">曲率在直—圆接缝处阶跃，作为下</text>
   </g>
   <g id="text_19">
    <text x="176.328" y="112.050806" transform="rotate(-0 176.328 112.050806)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">面四种做法的参照</text>
