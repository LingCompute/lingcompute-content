   <g id="text_20">
    <text x="176.328" y="145.084406" transform="rotate(-0 176.328 145.084406)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">曲率沿弧长线性升降，两端渐变、</text>
   </g>
   <g id="text_21">
    <text x="176.328" y="162.940406" transform="rotate(-0 176.328 162.940406)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">中间恒曲率</text>
   </g>
   <g id="text_22">
    <text x="176.328" y="195.974006" transform="rotate(-0 176.328 195.974006)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">中心展宽调节横向束形，使光聚焦</text>
   </g>
   <g id="text_23">
    <text x="176.328" y="213.830006" transform="rotate(-0 176.328 213.830006)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">通过交叉区</text>
   </g>
   <g id="text_24">
    <text x="176.328" y="246.863606" transform="rotate(-0 176.328 246.863606)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">Si 中刻 SiO2 矩形孔，用占空比各</text>
   </g>
   <g id="text_25">
    <text x="176.328" y="264.719606" transform="rotate(-0 176.328 264.719606)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">向异性压横向耦合</text>
   </g>
   <g id="text_26">
    <text x="176.328" y="297.753206" transform="rotate(-0 176.328 297.753206)" font-size="13.2px" font-family="MiSans, sans-serif" text-anchor="start" fill="#4a6076">在并行波导间加 SWG 超材料，把</text>
   </g>
