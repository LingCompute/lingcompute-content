   </g>
   <g id="text_6">
    <text transform="translate(272.16 235.107)" font-size="11.5px" font-family="MiSans, sans-serif" fill="#4a6076">周期结构把某个波长反射回去</text>
    <text transform="translate(272.16 251.632141)" font-size="11.5px" font-family="MiSans, sans-serif" fill="#4a6076">（λ = 2nΛ），其余通过。</text>
   </g>
   <g id="text_7">
