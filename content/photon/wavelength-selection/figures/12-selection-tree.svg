   <g id="text_4">
    <text transform="translate(264.6 97.832)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">挑一个 → 微环 / Bragg</text>
    <text transform="translate(264.6 113.887375)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">分多个 → MMI / AWG</text>
