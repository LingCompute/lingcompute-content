   <g id="text_3">
    <text x="33.768" y="92.942992" transform="rotate(-0 33.768 92.942992)" font-size="15.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#0b4c9c">插损 IL</text>
   </g>
   <g id="text_4">
    <text transform="translate(33.768 108.864)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">目标通道从输入到输出</text>
    <text transform="translate(33.768 124.41485)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">损失了多少功率</text>
   </g>
   <g id="text_5">
    <text x="192.528" y="92.942992" transform="rotate(-0 192.528 92.942992)" font-size="15.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#0b4c9c">通道间隔</text>
   </g>
   <g id="text_6">
    <text transform="translate(192.528 108.864)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">相邻通道的波长差</text>
    <text transform="translate(192.528 124.41485)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">CWDM 记 nm</text>
    <text transform="translate(192.528 139.9657)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">DWDM 记 GHz</text>
   </g>
   <g id="text_7">
    <text x="351.288" y="92.942992" transform="rotate(-0 351.288 92.942992)" font-size="15.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#0b4c9c">串扰</text>
   </g>
   <g id="text_8">
    <text transform="translate(351.288 108.864)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">别的通道漏进来多少</text>
    <text transform="translate(351.288 124.41485)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">相邻、非相邻、求和</text>
    <text transform="translate(351.288 139.9657)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">是三个不同的数</text>
   </g>
   <g id="text_9">
    <text x="33.768" y="189.710992" transform="rotate(-0 33.768 189.710992)" font-size="15.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#0b4c9c">3 dB 带宽</text>
   </g>
   <g id="text_10">
    <text transform="translate(33.768 205.632)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">相对通带峰值的半高宽</text>
    <text transform="translate(33.768 221.18285)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">需另看边沿与通道隔离</text>
   </g>
   <g id="text_11">
    <text x="192.528" y="189.710992" transform="rotate(-0 192.528 189.710992)" font-size="15.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#0b4c9c">FSR</text>
   </g>
   <g id="text_12">
    <text transform="translate(192.528 205.632)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">相邻谐振级次的间距</text>
    <text transform="translate(192.528 221.18285)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">需核查输入光谱内的假通</text>
    <text transform="translate(192.528 236.7337)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">道</text>
   </g>
   <g id="text_13">
    <text x="351.288" y="189.710992" transform="rotate(-0 351.288 189.710992)" font-size="15.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#0b4c9c">消光比</text>
   </g>
   <g id="text_14">
    <text transform="translate(351.288 205.632)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">通带峰值与阻带</text>
    <text transform="translate(351.288 221.18285)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">最低点之差</text>
    <text transform="translate(351.288 236.7337)" font-size="11.2px" font-family="MiSans, sans-serif" fill="#4a6076">决定隔离得多干净</text>
   </g>
   <g id="text_15">
    <text x="22.68" y="319.231445" transform="rotate(-0 22.68 319.231445)" font-size="12.5px" font-family="MiSans, sans-serif" text-anchor="start" fill="#8a9bab">六个量必须同时报；只报其中一两个，等于没有定义口径。</text>
   </g>
