name: Content CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: content-ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fonts
          key: ${{ runner.os }}-misans-${{ hashFiles('tools/fonts.py') }}
      - run: python tools/fonts.py
      # 版式与结构的检查不依赖浏览器：先跑，失败时省掉 Chromium 下载
      - run: python -m unittest discover -s tests
      - run: python tools/build.py --check
      - run: python -m playwright install --with-deps --no-shell chromium
      - run: python tools/build.py
      - run: python tools/catalog.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: article-preview
          path: build/
          retention-days: 14
          if-no-files-found: error
