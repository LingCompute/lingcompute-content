name: HTML previews

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: html-preview-render
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps --no-shell chromium
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/fonts
          key: ${{ runner.os }}-misans-${{ hashFiles('tools/fonts.py') }}
      - run: python tools/fonts.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/previews
          key: ${{ runner.os }}-preview-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-preview-v1-${{ github.sha }}-
      - name: Render main and all open PR snapshots
        run: python tools/preview.py build --cache .cache/previews
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: html-site
          path: build/site/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: html-preview-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: html-site
          path: build/site/
      - name: Deploy generated files and link current PR revisions
        run: python tools/preview.py publish
        env:
          GH_TOKEN: ${{ github.token }}
